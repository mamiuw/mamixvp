<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — MAMİXVP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mamixvp-theme">
  <div class="mamix-watermark">MAMİXVP</div>
  <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div style="width: 100%; max-width: 480px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 22px; padding: 36px; z-index: 5; position: relative;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 26px; font-weight: 800; color: #fff;">MAMİXVP Giriş Yap</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Hesabına giriş yap ve VP yatırımlarını yönet.</p>
      </div>

      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Riot ID / Kullanıcı Adı *</label>
          <input type="text" id="login-username" class="form-control" placeholder="Örn: JettMain#TR1" required>
        </div>

        <div class="form-group">
          <label>Şifre *</label>
          <input type="password" id="login-password" class="form-control" placeholder="Şifreni gir" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 10px;">
          Giriş Yap
        </button>
      </form>

      <div style="text-align: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-color); font-size: 14px; color: var(--text-muted);">
        Hesabın yok mu? <a href="kayit.html" style="color: var(--valorant-red); font-weight: 700; text-decoration: none;">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <script>
    function submitLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      
      if (window.vanguardGirisYap) {
        window.vanguardGirisYap(u, p);
      } else {
        alert("Firebase yükleniyor, 1 saniye bekleyip tekrar dene!");
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQSylUFCxkOcyZQwobbNnzcJX6QcEIQGs",
      authDomain: "cynorobux.firebaseapp.com",
      databaseURL: "https://cynorobux-default-rtdb.firebaseio.com",
      projectId: "cynorobux",
      storageBucket: "cynorobux.firebasestorage.app",
      messagingSenderId: "854181611047",
      appId: "1:854181611047:web:db37f6a281bca890d67002",
      measurementId: "G-8PQFNEH1F3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.vanguardGirisYap = function(username, password) {
      if (!username || !password) {
        alert("Lütfen tüm alanları doldur!");
        return;
      }

      const userRef = ref(db, 'users/' + username);

      get(userRef).then((snapshot) => {
        if (!snapshot.exists()) {
          alert("Böyle bir oyuncu bulunamadı kanka!");
          return;
        }

        const userData = snapshot.val();

        if (userData.banned) {
          alert("Bu hesap admin tarafından banlanmıştır! 🔴");
          return;
        }

        if (userData.password === password) {
          localStorage.setItem('vanguardUser', username);
          localStorage.setItem('vanguardBakiye', userData.bakiye || 0);
          
          alert("Giriş başarılı! Yönlendiriliyorsun... 🚀");
          window.location.href = "index.html";
        } else {
          alert("Şifre hatalı kanka!");
        }
      }).catch((error) => {
        console.error("Giriş hatası:", error);
        alert("Giriş sırasında bir hata oluştu.");
      });
    }
  </script>

<script id="mamixvp-protection">
(function(){
  const block=e=>{ if(e){e.preventDefault();e.stopPropagation();} return false; };
  document.addEventListener('contextmenu',block,{capture:true});
  document.addEventListener('dragstart',e=>e.preventDefault(),{capture:true});
  document.addEventListener('keydown',function(e){
    const k=(e.key||'').toLowerCase();
    if(e.key==='F12'||(e.ctrlKey&&['u','s','c','i','j'].includes(k))||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))) block(e);
  },{capture:true});
})();
</script>
</body>
</html>
